name: Reproducible simulation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the anonymous demo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned binary dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Verify the publication snapshot
        run: python scripts/audit_public_package.py --root .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate nominal simulation evidence
        run: python -m grasp_demo --seed 7 --case nominal --output runs/ci
      - name: Generate the no-target failure report
        run: python -m grasp_demo --seed 7 --case no-target --output runs/ci-no-target
      - name: Generate the out-of-workspace failure report
        run: python -m grasp_demo --seed 7 --case out-of-workspace --output runs/ci-out-of-workspace
